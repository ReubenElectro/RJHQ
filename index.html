<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root{
    --bg-1:#040308;
    --red-core:#fff3e8;
    --red-hot:#ff6a3d;
    --red-mid:#e2123f;
    --red-deep:#4a0713;
    --text:#f3f0ea;
    --muted:#8b8698;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-1);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    height:100vh;
    overflow:hidden;
    position:relative;
  }
  #orbCanvas{position:fixed; inset:0; z-index:1; cursor:pointer;}

  .wordmark{
    position:fixed; top:34px; left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:6px; text-transform:uppercase; color:var(--muted);
    z-index:5; pointer-events:none;
  }

  .status{
    position:fixed; top:calc(50% + 150px); left:50%; transform:translateX(-50%);
    font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    z-index:5; min-height:18px; transition:color .2s; pointer-events:none; text-align:center; width:100%;
  }
  .status.live{ color:var(--red-hot); }

  .caption{
    position:fixed; bottom:64px; left:50%; transform:translateX(-50%);
    max-width:560px; width:88vw; text-align:center; z-index:5;
    font-size:16px; line-height:1.55; color:var(--text);
    opacity:0; transition:opacity .35s ease; pointer-events:none;
  }
  .caption.show{ opacity:1; }
  .caption .role{
    display:block; font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }

  .dock{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center; z-index:6;
  }
  .dock button{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); color:var(--muted);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .dock button:hover{ background:rgba(255,255,255,0.08); color:var(--text); }
  .dock button.active{ border-color:rgba(226,18,63,0.6); color:var(--red-hot); }
  #jd-file-input, #jd-folder-input{ display:none; }

  .unsupported{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;
    max-width:380px; color:var(--muted); font-size:13.5px; line-height:1.6; display:none; z-index:10;
  }
</style>
</head>
<body>

<canvas id="orbCanvas"></canvas>
<div class="wordmark">Jade</div>
<div class="status" id="statusText">Say "Jade" to give a command</div>
<div class="caption" id="caption"><span class="role" id="captionRole"></span><span id="captionText"></span></div>

<div class="dock">
  <button id="fileBtn" title="Give Jade a file to read">📎</button>
  <button id="folderBtn" title="Give Jade a whole folder to browse">📁</button>
  <button id="muteBtn" title="Mute spoken replies">🔊</button>
  <button id="voiceBtn" title="Try the next voice">🎙️</button>
  <button id="colorBtn" title="Change the orb's colour">🎨</button>
</div>
<input type="color" id="jd-color-input" style="display:none">
<input type="file" id="jd-file-input">
<input type="file" id="jd-folder-input" webkitdirectory multiple>

<div class="unsupported" id="unsupported">
  Jade needs voice recognition, which this browser doesn't support here.<br>
  Try Chrome or Edge on desktop, or Chrome on Android.
</div>

<script>
/* =========================================================
   THREE.JS AUDIO-REACTIVE PARTICLE ORB
   (same technique as ethanplusai/jarvis's frontend/src/orb.ts —
   a Points cloud sphere, noise-displaced, additive glow sprites,
   scaled/roughened live by mic + speech amplitude)
========================================================= */
let scene, camera, renderer, particles, particleGeo, basePositions, particleCount;
let clock = new THREE.Clock();
let ampTarget = 0, ampCurrent = 0;

function makeGlowTexture(){
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,180,120,0.9)');
  g.addColorStop(0.6, 'rgba(255,80,50,0.35)');
  g.addColorStop(1, 'rgba(255,20,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}

let particleT; // per-particle bucket value, stored so we can recolor live

function derivePalette(baseHex){
  const base = new THREE.Color(baseHex);
  return {
    core: base.clone().lerp(new THREE.Color('#ffffff'), 0.82),
    hot:  base.clone().lerp(new THREE.Color('#ffffff'), 0.28),
    mid:  base.clone(),
    deep: base.clone().lerp(new THREE.Color('#000000'), 0.86)
  };
}

function applyPalette(baseHex){
  const {core, hot, mid, deep} = derivePalette(baseHex);
  const colors = particleGeo.attributes.color.array;
  for(let i=0;i<particleCount;i++){
    const t = particleT[i];
    let col;
    if(t < 0.15) col = core.clone().lerp(hot, Math.random());
    else if(t < 0.55) col = hot.clone().lerp(mid, Math.random());
    else col = mid.clone().lerp(deep, Math.random());
    colors[i*3]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;
  }
  particleGeo.attributes.color.needsUpdate = true;
  localStorage.setItem('jade_orb_color', baseHex);
}

function initOrb(){
  const canvas = document.getElementById('orbCanvas');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  camera.position.z = 6.2;

  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  particleCount = 4200;
  particleGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount*3);
  basePositions = new Float32Array(particleCount*3);
  const colors = new Float32Array(particleCount*3);
  const sizes = new Float32Array(particleCount);
  particleT = new Float32Array(particleCount);

  const savedHex = localStorage.getItem('jade_orb_color') || '#c21f2f'; // blood ember default
  const {core: colorCore, hot: colorHot, mid: colorMid, deep: colorDeep} = derivePalette(savedHex);

  const R = 2.0;
  for(let i=0;i<particleCount;i++){
    // fibonacci sphere distribution for even coverage
    const y = 1 - (i / (particleCount-1)) * 2;
    const radiusAtY = Math.sqrt(1 - y*y);
    const theta = Math.PI * (1 + Math.sqrt(5)) * i;
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;

    const jitter = 0.85 + Math.random()*0.3;
    const px = x * R * jitter, py = y * R * jitter, pz = z * R * jitter;

    positions[i*3] = px; positions[i*3+1] = py; positions[i*3+2] = pz;
    basePositions[i*3] = x; basePositions[i*3+1] = y; basePositions[i*3+2] = z;

    const t = Math.random();
    particleT[i] = t;
    let col;
    if(t < 0.15) col = colorCore.clone().lerp(colorHot, Math.random());
    else if(t < 0.55) col = colorHot.clone().lerp(colorMid, Math.random());
    else col = colorMid.clone().lerp(colorDeep, Math.random());
    colors[i*3]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;

    sizes[i] = (Math.random()*0.55 + 0.35) * 0.16;
  }

  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes,1));

  const material = new THREE.PointsMaterial({
    size:0.16, map:makeGlowTexture(), transparent:true, depthWrite:false,
    vertexColors:true, blending:THREE.AdditiveBlending, sizeAttenuation:true
  });

  particles = new THREE.Points(particleGeo, material);
  scene.add(particles);

  // faint core glow sphere for extra warmth
  const coreLight = new THREE.PointLight(0xff5a3d, 1.4, 8);
  scene.add(coreLight);

  window.addEventListener('resize', onResize);
  animateOrb();
}

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

// simple 3D value-noise (cheap, no external lib) for organic swirl
function hash3(x,y,z){
  const s = Math.sin(x*12.9898 + y*78.233 + z*37.719) * 43758.5453;
  return s - Math.floor(s); // always 0..1, unlike raw % which goes negative
}
function noise3(x,y,z){
  const fx=Math.floor(x), fy=Math.floor(y), fz=Math.floor(z);
  const dx=x-fx, dy=y-fy, dz=z-fz;
  let sum=0, wsum=0;
  for(let i=0;i<=1;i++)for(let j=0;j<=1;j++)for(let k=0;k<=1;k++){
    const w=(i?dx:1-dx)*(j?dy:1-dy)*(k?dz:1-dz);
    sum += w * hash3(fx+i, fy+j, fz+k);
    wsum += w;
  }
  return sum/wsum;
}

function animateOrb(){
  requestAnimationFrame(animateOrb);
  const t = clock.getElapsedTime();

  ampCurrent += (ampTarget - ampCurrent) * 0.12;

  const pos = particleGeo.attributes.position.array;
  const swirlSpeed = 0.05 + ampCurrent*0.16;
  const displaceScale = 0.025 + ampCurrent*0.14;

  for(let i=0;i<particleCount;i++){
    const bx = basePositions[i*3], by = basePositions[i*3+1], bz = basePositions[i*3+2];
    const n = noise3(bx*1.6 + t*swirlSpeed, by*1.6 + t*swirlSpeed*0.8, bz*1.6 - t*swirlSpeed*0.6);
    const R = 2.0 + (n-0.5) * displaceScale * 2.2 + ampCurrent*0.12;
    pos[i*3]   = bx * R;
    pos[i*3+1] = by * R;
    pos[i*3+2] = bz * R;
  }
  particleGeo.attributes.position.needsUpdate = true;

  particles.rotation.y = t * 0.012;
  particles.rotation.x = Math.sin(t*0.02) * 0.015;

  const s = 1 + ampCurrent*0.05;
  particles.scale.set(s,s,s);

  renderer.render(scene, camera);
}

initOrb();

/* =========================================================
   INTERACTION (voice-only, same behaviour as before)
========================================================= */
let listening = false;
let speaking = false;
let muted = false;
let attachedFile = null;
let audioCtx, analyser, micStream, rafId;

const statusText = document.getElementById('statusText');
const caption = document.getElementById('caption');
const captionRole = document.getElementById('captionRole');
const captionText = document.getElementById('captionText');

function setStatus(text, live){
  statusText.textContent = text;
  statusText.classList.toggle('live', !!live);
}
function showCaption(role, text){
  captionRole.textContent = role;
  captionText.textContent = text;
  caption.classList.add('show');
}
function hideCaptionLater(delay){
  clearTimeout(showCaption._t);
  showCaption._t = setTimeout(()=> caption.classList.remove('show'), delay || 5000);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let micActive = false; // hands-free mode on/off

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-GB';

  recognition.onstart = ()=>{
    listening = true;
    setStatus('Listening for "Jade"…', true);
    startMicVisualizer();
  };
  recognition.onend = ()=>{
    listening = false;
    stopMicVisualizer();
    if(micActive && !speaking){
      try{ recognition.start(); }catch(e){} // keep the hot mic alive
    }else if(!speaking){
      setStatus('Tap Jade to start hands-free listening');
    }
  };
  recognition.onerror = (e)=>{
    listening = false;
    stopMicVisualizer();
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      micActive = false;
      setStatus('Microphone blocked — allow mic access, then tap Jade');
    }
    // 'no-speech' and similar are routine in continuous mode — onend handles the restart
  };
  recognition.onresult = (e)=>{
    if(speaking) return; // ignore anything picked up while Jade itself is talking
    const res = e.results[e.results.length - 1];
    const said = res[0].transcript.trim();
    if(!/\bjade\b/i.test(said)) return; // wake word required — ignore ambient conversation
    const command = said.replace(/\bjade\b/i, '').trim();
    showCaption('You said', said);
    handleQuestion(command || said);
  };

  // try to go hands-free automatically; browsers that block this without a
  // click will throw, and the tap fallback below covers that case
  try{ micActive = true; recognition.start(); }
  catch(e){ micActive = false; setStatus('Tap Jade to start hands-free listening'); }
}else{
  document.getElementById('unsupported').style.display = 'block';
}

document.getElementById('orbCanvas').addEventListener('click', ()=>{
  if(!recognition) return;
  if(speaking){ window.speechSynthesis.cancel(); speaking = false; }
  micActive = !micActive;
  if(micActive){
    try{ recognition.start(); }catch(e){}
  }else{
    try{ recognition.stop(); }catch(e){}
    setStatus('Tap Jade to start hands-free listening');
  }
});

async function startMicVisualizer(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    function loop(){
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a,b)=>a+b,0) / data.length;
      ampTarget = Math.min(1, avg / 90);
      rafId = requestAnimationFrame(loop);
    }
    loop();
  }catch(e){}
}
function stopMicVisualizer(){
  if(rafId) cancelAnimationFrame(rafId);
  ampTarget = 0;
  if(micStream){ micStream.getTracks().forEach(tr=>tr.stop()); micStream = null; }
  if(audioCtx){ audioCtx.close(); audioCtx = null; }
}

function animateSpeakingAmp(durationMs){
  const start = performance.now();
  function loop(now){
    if(!speaking){ ampTarget = 0; return; }
    const t = (now-start)/1000;
    ampTarget = (Math.sin(t*7)*0.5+0.5)*0.28 + Math.random()*0.03;
    if(now-start < durationMs) requestAnimationFrame(loop);
    else ampTarget = 0;
  }
  requestAnimationFrame(loop);
}

const fileBtn = document.getElementById('fileBtn');
const fileInput = document.getElementById('jd-file-input');
fileBtn.addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    let content = ev.target.result;
    if(typeof content !== 'string') content = '[binary file — could not read as text]';
    if(content.length > 12000) content = content.slice(0,12000) + '\n...[truncated]';
    attachedFile = {name:file.name, content};
    folderFiles = null;
    fileBtn.classList.add('active');
    folderBtn.classList.remove('active');
    fileBtn.title = 'Attached: ' + file.name;
    setStatus('Got "' + file.name + '" — tap Jade to ask about it');
  };
  reader.readAsText(file);
});

let folderFiles = null;      // {name.toLowerCase(): FileSystemFileHandle or File}
let folderHandle = null;     // persisted FileSystemDirectoryHandle, when supported
const folderBtn = document.getElementById('folderBtn');
const folderInput = document.getElementById('jd-folder-input');
const supportsPersistentFolder = 'showDirectoryPicker' in window;

// tiny IndexedDB helper — stores the directory handle itself so it survives reloads
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('jade-fs', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('handles');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = ()=> resolve();
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> resolve(null);
  });
}

async function buildFolderIndexFromHandle(handle){
  const index = {};
  for await (const [name, entryHandle] of handle.entries()){
    if(entryHandle.kind === 'file') index[name.toLowerCase()] = entryHandle;
  }
  return index;
}

async function activateFolderHandle(handle, count){
  folderHandle = handle;
  folderFiles = await buildFolderIndexFromHandle(handle);
  attachedFile = null;
  folderBtn.classList.add('active');
  fileBtn.classList.remove('active');
  const n = Object.keys(folderFiles).length;
  folderBtn.title = n + ' files loaded — remembered for next time';
  setStatus('Loaded ' + n + ' files — say a filename to open one');
}

folderBtn.addEventListener('click', async ()=>{
  if(supportsPersistentFolder && folderBtn.dataset.pendingRestore === 'true'){
    const handle = await idbGet('folder');
    if(handle){
      const perm = await handle.requestPermission({mode:'read'});
      delete folderBtn.dataset.pendingRestore;
      if(perm === 'granted'){ await activateFolderHandle(handle); return; }
    }
  }
  if(supportsPersistentFolder){
    try{
      const handle = await window.showDirectoryPicker();
      await idbSet('folder', handle);
      await activateFolderHandle(handle);
    }catch(e){ /* user cancelled the picker */ }
  }else{
    folderInput.click(); // Safari etc: no persistence possible, pick each time
  }
});
folderInput.addEventListener('change', (e)=>{
  const files = Array.from(e.target.files);
  if(!files.length) return;
  folderFiles = {};
  files.forEach(f=> folderFiles[f.name.toLowerCase()] = f);
  attachedFile = null;
  folderBtn.classList.add('active');
  fileBtn.classList.remove('active');
  folderBtn.title = files.length + ' files loaded';
  setStatus('Loaded ' + files.length + ' files — say a filename to open one');
});

// on load: try to silently reconnect to a previously-granted folder
(async function tryRestoreFolder(){
  if(!supportsPersistentFolder) return;
  const handle = await idbGet('folder');
  if(!handle) return;
  const perm = await handle.queryPermission({mode:'read'});
  if(perm === 'granted'){
    await activateFolderHandle(handle);
  }else{
    // one click to reconfirm — no full re-browse needed
    folderBtn.classList.add('active');
    folderBtn.title = 'Tap to reconnect your remembered folder';
    folderBtn.dataset.pendingRestore = 'true';
  }
})();

async function readFileAsText(fileOrHandle){
  const file = fileOrHandle.getFile ? await fileOrHandle.getFile() : fileOrHandle;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      let content = ev.target.result;
      if(typeof content !== 'string') content = '[binary file — could not read as text]';
      if(content.length > 12000) content = content.slice(0,12000) + '\n...[truncated]';
      resolve(content);
    };
    reader.onerror = ()=> resolve('[could not read this file]');
    reader.readAsText(file);
  });
}
function findFolderFileByName(said){
  if(!folderFiles) return null;
  const spoken = said.toLowerCase();
  for(const name in folderFiles){
    const bare = name.replace(/\.[a-z0-9]+$/,'');
    if(spoken.includes(name) || spoken.includes(bare)) return folderFiles[name];
  }
  return null;
}

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('active', muted);
  if(muted) window.speechSynthesis.cancel();
});

const HOME_LOCATION = { name: 'Lichfield, England', lat: 52.6825, lon: -1.8262 };

const voiceBtn = document.getElementById('voiceBtn');
let voiceIndex = parseInt(localStorage.getItem('jade_voice_index') || '-1', 10);
function englishVoices(){
  return window.speechSynthesis.getVoices().filter(v=>v.lang && v.lang.startsWith('en'));
}
voiceBtn.addEventListener('click', ()=>{
  const list = englishVoices();
  if(!list.length){ setStatus('No voices found yet — try again in a second'); return; }
  voiceIndex = (voiceIndex + 1) % list.length;
  localStorage.setItem('jade_voice_index', voiceIndex);
  const v = list[voiceIndex];
  setStatus('Voice: ' + v.name);
  const test = new SpeechSynthesisUtterance("This is Jade. This is how I sound.");
  test.voice = v; test.pitch = 0.9; test.rate = 0.93;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(test);
});

const colorBtn = document.getElementById('colorBtn');
const colorInput = document.getElementById('jd-color-input');
colorInput.value = localStorage.getItem('jade_orb_color') || '#c21f2f';
colorBtn.addEventListener('click', ()=> colorInput.click());
colorInput.addEventListener('input', (e)=>{
  applyPalette(e.target.value);
});

function extractCity(text){
  const m = text.match(/weather (?:in|for|at)\s+([a-zA-Z\s]+)/i);
  if(m) return m[1].trim().replace(/[?.!]$/,'');
  return null;
}
function mentionsWeather(text){
  return /weather|forecast|raining|going to rain|temperature outside|is it cold|is it hot|umbrella/i.test(text);
}
async function fetchWeatherAt(lat, lon, label){
  try{
    const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,relative_humidity_2m&timezone=auto`);
    const w = await wRes.json();
    return {place: label, temp: w.current.temperature_2m, wind: w.current.wind_speed_10m, humidity: w.current.relative_humidity_2m};
  }catch(e){ return null; }
}
async function fetchWeather(city){
  try{
    const geoRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(city) + '&count=1');
    const geo = await geoRes.json();
    if(!geo.results || !geo.results.length) return null;
    const loc = geo.results[0];
    return fetchWeatherAt(loc.latitude, loc.longitude, loc.name + (loc.country ? ', ' + loc.country : ''));
  }catch(e){ return null; }
}

// Resolves ANY valid CSS colour — all ~150 named colours, hex, rgb(), hsl() —
// not a curated shortlist. Validated via the DOM's own colour parser, then
// read back as exact RGB through a 1x1 canvas. This is the permanent,
// hard-coded path: no word list to maintain, no "colour not recognised" gaps.
function isValidCssColor(str){
  const probe = new Option().style;
  probe.color = '';
  probe.color = str;
  return probe.color !== '';
}
function cssColorToHex(name){
  if(!isValidCssColor(name)) return null;
  const c = document.createElement('canvas'); c.width = c.height = 1;
  const ctx = c.getContext('2d');
  ctx.fillStyle = name;
  ctx.fillRect(0,0,1,1);
  const d = ctx.getImageData(0,0,1,1).data;
  return '#' + [d[0],d[1],d[2]].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function tryColorCommand(said){
  const m = said.match(/(?:change|make|turn|set)\s+(?:your\s+|the\s+)?(?:orb|colou?r)\s+(?:to\s+)?([a-zA-Z\s]+)/i);
  if(!m) return false;
  const name = m[1].trim().replace(/[.?!]+$/,'');
  if(!name) return false;
  const hex = cssColorToHex(name);
  if(!hex) return false;
  applyPalette(hex);
  speakReply(`Done — I'm ${name} now.`);
  return true;
}

async function handleQuestion(said){
  const colorCommand = tryColorCommand(said);
  if(colorCommand) return;

  setStatus('Thinking…');
  let contextBlocks = [
    "You are Jade, a sharp, direct voice assistant. You are being spoken to out loud and your reply will be read aloud by text-to-speech, so answer conversationally in 1-4 short sentences — no markdown, no lists, nothing that only makes sense written down. Be honest and useful, never falsely flattering."
  ];
  if(attachedFile){
    contextBlocks.push(`The user has given you a file named "${attachedFile.name}" to read. Its content:\n\n${attachedFile.content}`);
  }else{
    const folderMatch = findFolderFileByName(said);
    if(folderMatch){
      const content = await readFileAsText(folderMatch);
      contextBlocks.push(`The user asked about a file named "${folderMatch.name}" from their folder. Its content:\n\n${content}`);
    }
  }
  const namedCity = extractCity(said);
  if(namedCity){
    const weather = await fetchWeather(namedCity);
    if(weather) contextBlocks.push(`Live weather data for ${weather.place}: ${weather.temp}°C, wind ${weather.wind} km/h, humidity ${weather.humidity}%. Use these real numbers.`);
  }else if(mentionsWeather(said)){
    const weather = await fetchWeatherAt(HOME_LOCATION.lat, HOME_LOCATION.lon, HOME_LOCATION.name);
    if(weather) contextBlocks.push(`Live weather data for ${weather.place} (home location): ${weather.temp}°C, wind ${weather.wind} km/h, humidity ${weather.humidity}%. Use these real numbers.`);
  }
  // Puter.js — free, no API key, no billing on your end. IMPORTANT: puter.ai.chat
  // has no separate "system" option — it must go inside the messages array as the
  // first message, or it's silently ignored (which is why replies came back as
  // markdown lists and the voice read the asterisks out loud).
  try{
    const reply = await puter.ai.chat([
      { role: 'system', content: contextBlocks.join('\n\n---\n\n') },
      { role: 'user', content: said }
    ], { model: 'gpt-5.4' });
    let text = (typeof reply === 'string' ? reply : (reply?.message?.content || reply?.text || '')).trim();
    text = stripMarkdown(text);
    speakReply(text || "I didn't get a clean answer that time — ask me again.");
  }catch(err){
    speakReply("I couldn't reach the AI service just then. If a sign-in popup appeared, complete it once and ask again.");
  }
}

function stripMarkdown(text){
  return text
    .replace(/[*_`#]/g, '')
    .replace(/^[-•]\s+/gm, '')
    .replace(/\n{2,}/g, ' ')
    .replace(/\n/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function speakReply(text){
  showCaption('Jade', text);
  hideCaptionLater(Math.max(5000, text.length * 60));

  if(muted || !('speechSynthesis' in window)){ setStatus('Tap Jade to talk'); return; }
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.93; utter.pitch = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const enVoices = voices.filter(v=>v.lang && v.lang.startsWith('en'));
  const saved = parseInt(localStorage.getItem('jade_voice_index') || '-1', 10);
  // Posh, elderly English gentleman rather than a flat robotic default —
  // prefer mature-sounding UK voices (Daniel, Arthur, George etc), then any
  // UK English, then fall back to the sampler pick or the browser default.
  const preferred =
    (saved >= 0 && enVoices[saved]) ||
    voices.find(v=>/Daniel|Arthur|George|Ralph|Bruce|Oliver/i.test(v.name) && /en-GB|UK/i.test(v.lang + v.name)) ||
    voices.find(v=>v.lang === 'en-GB') ||
    voices.find(v=>v.default) || enVoices[0];
  if(preferred) utter.voice = preferred;

  utter.onstart = ()=>{
    speaking = true;
    if(recognition && listening){ try{ recognition.stop(); }catch(e){} }
    setStatus('Speaking…', true);
    animateSpeakingAmp(Math.max(1200, text.length*55));
  };
  utter.onend = ()=>{
    speaking = false;
    ampTarget = 0;
    if(recognition && micActive){ try{ recognition.start(); }catch(e){} }
    else setStatus('Tap Jade to start hands-free listening');
  };
  utter.onerror = ()=>{
    speaking = false;
    if(recognition && micActive){ try{ recognition.start(); }catch(e){} }
    else setStatus('Tap Jade to start hands-free listening');
  };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=> window.speechSynthesis.getVoices(); }
</script>
