<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root{
    --bg-1:#040308;
    --red-core:#fff3e8;
    --red-hot:#ff6a3d;
    --red-mid:#e2123f;
    --red-deep:#4a0713;
    --text:#f3f0ea;
    --muted:#8b8698;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-1);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    height:100vh;
    overflow:hidden;
    position:relative;
  }
  #orbCanvas{position:fixed; inset:0; z-index:1; cursor:pointer;}

  .wordmark{
    position:fixed; top:34px; left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:6px; text-transform:uppercase; color:var(--muted);
    z-index:5; pointer-events:none;
  }

  .status{
    position:fixed; top:calc(50% + 150px); left:50%; transform:translateX(-50%);
    font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    z-index:5; min-height:18px; transition:color .2s; pointer-events:none; text-align:center; width:100%;
  }
  .status.live{ color:var(--red-hot); }

  .caption{
    position:fixed; bottom:64px; left:50%; transform:translateX(-50%);
    max-width:560px; width:88vw; text-align:center; z-index:5;
    font-size:16px; line-height:1.55; color:var(--text);
    opacity:0; transition:opacity .35s ease; pointer-events:none;
  }
  .caption.show{ opacity:1; }
  .caption .role{
    display:block; font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }

  .dock{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center; z-index:6;
  }
  .dock button{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); color:var(--muted);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .dock button:hover{ background:rgba(255,255,255,0.08); color:var(--text); }
  .dock button.active{ border-color:rgba(226,18,63,0.6); color:var(--red-hot); }
  #jd-file-input, #jd-folder-input{ display:none; }

  .unsupported{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;
    max-width:380px; color:var(--muted); font-size:13.5px; line-height:1.6; display:none; z-index:10;
  }  /* ===== Hologram interface ===== */
  :root{ --holo:#4de8ff; --holo-dim:rgba(77,232,255,0.35); }
  #holoOverlay{
    position:fixed; inset:0; z-index:80; display:none;
    background:
      repeating-linear-gradient(0deg, rgba(77,232,255,0.025) 0px, rgba(77,232,255,0.025) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse 1000px 700px at 50% 45%, rgba(20,60,70,0.5), rgba(2,4,8,0.92));
  }
  #holoOverlay.open{ display:block; }
  #holoClose{
    position:absolute; top:24px; right:28px; z-index:90; background:none; border:1px solid var(--holo-dim);
    color:var(--holo); width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer;
    text-shadow:0 0 8px var(--holo);
  }
  #holoStage{ position:absolute; inset:0; }
  .holo-panel{
    position:absolute; width:290px; background:rgba(6,20,26,0.55);
    border:1px solid var(--holo-dim); color:var(--holo); font-family:'Consolas','Menlo',monospace;
    box-shadow:0 0 24px rgba(77,232,255,0.15), inset 0 0 30px rgba(77,232,255,0.05);
    backdrop-filter:blur(2px); user-select:none; cursor:grab;
  }
  .holo-panel:active{ cursor:grabbing; }
  .holo-panel::before, .holo-panel::after{
    content:''; position:absolute; width:14px; height:14px; border:1.5px solid var(--holo); opacity:0.8;
  }
  .holo-panel::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .holo-panel::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .holo-head{
    padding:9px 14px; font-size:10.5px; letter-spacing:2px; text-transform:uppercase;
    border-bottom:1px solid var(--holo-dim); display:flex; justify-content:space-between; opacity:0.85;
  }
  .holo-body{ padding:14px; font-size:12px; line-height:1.7; }
  .holo-body .row{ display:flex; justify-content:space-between; margin-bottom:4px; opacity:0.85; }
  .holo-body .row.holo-link{ cursor:pointer; opacity:1; transition:all .12s; }
  .holo-body .row.holo-link:hover{ background:rgba(77,232,255,0.1); text-shadow:0 0 6px var(--holo); }
  .holo-body .row.holo-link span:first-child::before{ content:'↗ '; }
  .holo-body .row.holo-flash{ animation:holoFlash 1.4s ease; border-radius:3px; }
  @keyframes holoFlash{
    0%{ background:rgba(77,232,255,0.5); box-shadow:0 0 14px rgba(77,232,255,0.6); }
    100%{ background:transparent; box-shadow:none; }
  }
  .scan-frame{ position:relative; width:100%; aspect-ratio:4/3; overflow:hidden; border:1px solid var(--holo-dim); background:#000; }
  .scan-frame video{ width:100%; height:100%; object-fit:cover; filter:grayscale(0.3) contrast(1.15) brightness(1.05); opacity:0.85; }
  .scan-sweep{
    position:absolute; left:0; right:0; height:3px; background:linear-gradient(90deg, transparent, var(--holo), transparent);
    box-shadow:0 0 12px var(--holo); animation:scanSweep 2.4s linear infinite;
  }
  @keyframes scanSweep{ 0%{ top:0%; } 100%{ top:100%; } }
  .scan-grid{
    position:absolute; inset:0; pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(77,232,255,0.08) 0, rgba(77,232,255,0.08) 1px, transparent 1px, transparent 22px),
      repeating-linear-gradient(90deg, rgba(77,232,255,0.08) 0, rgba(77,232,255,0.08) 1px, transparent 1px, transparent 22px);
  }
  .bpm-readout{ font-size:26px; font-weight:bold; letter-spacing:1px; }
  .bpm-pulse{ display:inline-block; animation:bpmPulse 0.9s ease-in-out infinite; }
  @keyframes bpmPulse{ 0%,100%{ opacity:0.5; } 50%{ opacity:1; text-shadow:0 0 10px var(--holo); } }
  .scan-caveat{ font-size:10px; opacity:0.55; line-height:1.5; margin-top:8px; }
  .holo-body svg{ width:100%; height:auto; filter:drop-shadow(0 0 6px var(--holo)); }
  .holo-flicker{ animation:holoFlicker 4s infinite; }
  @keyframes holoFlicker{
    0%,96%,100%{ opacity:1; } 97%{ opacity:0.55; } 98%{ opacity:1; } 99%{ opacity:0.7; }
  }
  /* ===== Arc reactor loading / closing sequence ===== */
  #loadOverlay{
    position:fixed; inset:0; z-index:95; display:none; background:#020202;
    align-items:center; justify-content:center; flex-direction:column; overflow:hidden;
  }
  #loadOverlay.active{ display:flex; }
  .reactor-wrap{ position:relative; z-index:1; width:min(38vmin,220px); height:min(38vmin,220px); }
  .reactor-svg{ width:100%; height:100%; filter:drop-shadow(0 0 40px rgba(255,120,40,0.7)) drop-shadow(0 0 90px rgba(226,18,63,0.4)); }
  .reactor-core{ animation:reactorPulse 1.1s ease-in-out infinite; }
  @keyframes reactorPulse{ 0%,100%{ opacity:0.85; } 50%{ opacity:1; } }
  .reactor-ring{ transform-origin:100px 100px; }
  .ring1{ animation:spinRing 3s linear infinite; }
  .ring2{ animation:spinRing 4.5s linear infinite reverse; }
  .ring3{ animation:spinRing 6s linear infinite; }
  @keyframes spinRing{ to{ transform:rotate(360deg); } }
  .load-text{
    position:relative; z-index:1; margin-top:26px; color:#ff9a4d; font-family:'Consolas','Menlo',monospace;
    font-size:13px; letter-spacing:3px; text-transform:uppercase; text-shadow:0 0 10px rgba(255,120,40,0.7);
    min-height:20px;
  }
  .shutter{
    position:absolute; top:0; bottom:0; width:50%; background:#020202; z-index:2;
    transition:transform 0.8s cubic-bezier(.77,0,.18,1);
    box-shadow:inset 0 0 60px rgba(255,90,20,0.15);
  }
  .shutter-left{ left:0; border-right:1px solid rgba(255,120,40,0.4); transform:translateX(0); }
  .shutter-right{ right:0; border-left:1px solid rgba(255,120,40,0.4); transform:translateX(0); }
  .shutter-left.opened{ transform:translateX(-100%); }
  .shutter-right.opened{ transform:translateX(100%); }
</style>
</head>
<body>

<canvas id="orbCanvas"></canvas>
<div class="wordmark">Jade</div>
<div class="status" id="statusText">Tap once, then say "Jade" anytime</div>
<div class="caption" id="caption"><span class="role" id="captionRole"></span><span id="captionText"></span></div>

<div class="dock">
  <button id="fileBtn" title="Give Jade a file to read">📎</button>
  <button id="folderBtn" title="Give Jade a whole folder to browse">📁</button>
  <button id="muteBtn" title="Mute spoken replies">🔊</button>
  <button id="voiceBtn" title="Try the next voice">🎙️</button>
  <button id="colorBtn" title="Change the orb's colour">🎨</button>
  <button id="holoBtn" title="Open the hologram interface">🔷</button>
  <button id="scanBtn" title="Live body scan (experimental heart-rate estimate)">🩻</button>
</div>
<input type="color" id="jd-color-input" style="display:none">
<input type="file" id="jd-file-input">
<input type="file" id="jd-folder-input" webkitdirectory multiple>

<div id="holoOverlay">
  <button id="holoClose" title="Close hologram interface">&times;</button>
  <div id="holoStage"></div>
</div>

<div id="loadOverlay">
  <div class="reactor-wrap">
    <svg class="reactor-svg" viewBox="0 0 200 200">
      <defs>
        <radialGradient id="reactorGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6e6"/>
          <stop offset="25%" stop-color="#ffb347"/>
          <stop offset="55%" stop-color="#ff6a1a"/>
          <stop offset="100%" stop-color="#5a1200"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="30" fill="url(#reactorGrad)" class="reactor-core"/>
      <circle cx="100" cy="100" r="46" fill="none" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="6 6" class="reactor-ring ring1"/>
      <circle cx="100" cy="100" r="62" fill="none" stroke="#ff5a1a" stroke-width="1.5" stroke-dasharray="10 4" class="reactor-ring ring2"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#e2123f" stroke-width="1" stroke-dasharray="2 8" class="reactor-ring ring3"/>
    </svg>
  </div>
  <div id="loadText" class="load-text"></div>
  <div class="shutter shutter-left" id="shutterLeft"></div>
  <div class="shutter shutter-right" id="shutterRight"></div>
</div>

<div class="unsupported" id="unsupported">
  Jade needs voice recognition, which this browser doesn't support here.<br>
  Try Chrome or Edge on desktop, or Chrome on Android.
</div>

<script>
/* =========================================================
   THREE.JS AUDIO-REACTIVE PARTICLE ORB
   (same technique as ethanplusai/jarvis's frontend/src/orb.ts —
   a Points cloud sphere, noise-displaced, additive glow sprites,
   scaled/roughened live by mic + speech amplitude)
========================================================= */
let scene, camera, renderer, particles, particleGeo, basePositions, particleCount;
let clock = new THREE.Clock();
let ampTarget = 0, ampCurrent = 0;

function makeGlowTexture(){
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,180,120,0.9)');
  g.addColorStop(0.6, 'rgba(255,80,50,0.35)');
  g.addColorStop(1, 'rgba(255,20,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}

let particleT; // per-particle bucket value, stored so we can recolor live

function derivePalette(baseHex){
  const base = new THREE.Color(baseHex);
  return {
    core: base.clone().lerp(new THREE.Color('#ffffff'), 0.82),
    hot:  base.clone().lerp(new THREE.Color('#ffffff'), 0.28),
    mid:  base.clone(),
    deep: base.clone().lerp(new THREE.Color('#000000'), 0.86)
  };
}

function applyPalette(baseHex){
  const {core, hot, mid, deep} = derivePalette(baseHex);
  const colors = particleGeo.attributes.color.array;
  for(let i=0;i<particleCount;i++){
    const t = particleT[i];
    let col;
    if(t < 0.15) col = core.clone().lerp(hot, Math.random());
    else if(t < 0.55) col = hot.clone().lerp(mid, Math.random());
    else col = mid.clone().lerp(deep, Math.random());
    colors[i*3]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;
  }
  particleGeo.attributes.color.needsUpdate = true;
  localStorage.setItem('jade_orb_color', baseHex);
}

function initOrb(){
  const canvas = document.getElementById('orbCanvas');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  camera.position.z = 6.2;

  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  particleCount = 4200;
  particleGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount*3);
  basePositions = new Float32Array(particleCount*3);
  const colors = new Float32Array(particleCount*3);
  const sizes = new Float32Array(particleCount);
  particleT = new Float32Array(particleCount);

  const savedHex = localStorage.getItem('jade_orb_color') || '#c21f2f'; // blood ember default
  const {core: colorCore, hot: colorHot, mid: colorMid, deep: colorDeep} = derivePalette(savedHex);

  const R = 2.0;
  for(let i=0;i<particleCount;i++){
    // fibonacci sphere distribution for even coverage
    const y = 1 - (i / (particleCount-1)) * 2;
    const radiusAtY = Math.sqrt(1 - y*y);
    const theta = Math.PI * (1 + Math.sqrt(5)) * i;
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;

    const jitter = 0.85 + Math.random()*0.3;
    const px = x * R * jitter, py = y * R * jitter, pz = z * R * jitter;

    positions[i*3] = px; positions[i*3+1] = py; positions[i*3+2] = pz;
    basePositions[i*3] = x; basePositions[i*3+1] = y; basePositions[i*3+2] = z;

    const t = Math.random();
    particleT[i] = t;
    let col;
    if(t < 0.15) col = colorCore.clone().lerp(colorHot, Math.random());
    else if(t < 0.55) col = colorHot.clone().lerp(colorMid, Math.random());
    else col = colorMid.clone().lerp(colorDeep, Math.random());
    colors[i*3]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;

    sizes[i] = (Math.random()*0.55 + 0.35) * 0.16;
  }

  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes,1));

  const material = new THREE.PointsMaterial({
    size:0.16, map:makeGlowTexture(), transparent:true, depthWrite:false,
    vertexColors:true, blending:THREE.AdditiveBlending, sizeAttenuation:true
  });

  particles = new THREE.Points(particleGeo, material);
  scene.add(particles);

  // faint core glow sphere for extra warmth
  const coreLight = new THREE.PointLight(0xff5a3d, 1.4, 8);
  scene.add(coreLight);

  window.addEventListener('resize', onResize);
  animateOrb();
}

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

// simple 3D value-noise (cheap, no external lib) for organic swirl
function hash3(x,y,z){
  const s = Math.sin(x*12.9898 + y*78.233 + z*37.719) * 43758.5453;
  return s - Math.floor(s); // always 0..1, unlike raw % which goes negative
}
function noise3(x,y,z){
  const fx=Math.floor(x), fy=Math.floor(y), fz=Math.floor(z);
  const dx=x-fx, dy=y-fy, dz=z-fz;
  let sum=0, wsum=0;
  for(let i=0;i<=1;i++)for(let j=0;j<=1;j++)for(let k=0;k<=1;k++){
    const w=(i?dx:1-dx)*(j?dy:1-dy)*(k?dz:1-dz);
    sum += w * hash3(fx+i, fy+j, fz+k);
    wsum += w;
  }
  return sum/wsum;
}

function animateOrb(){
  requestAnimationFrame(animateOrb);
  const t = clock.getElapsedTime();

  ampCurrent += (ampTarget - ampCurrent) * 0.12;

  const pos = particleGeo.attributes.position.array;
  const swirlSpeed = 0.05 + ampCurrent*0.16;
  const displaceScale = 0.025 + ampCurrent*0.14;

  for(let i=0;i<particleCount;i++){
    const bx = basePositions[i*3], by = basePositions[i*3+1], bz = basePositions[i*3+2];
    const n = noise3(bx*1.6 + t*swirlSpeed, by*1.6 + t*swirlSpeed*0.8, bz*1.6 - t*swirlSpeed*0.6);
    const R = 2.0 + (n-0.5) * displaceScale * 2.2 + ampCurrent*0.12;
    pos[i*3]   = bx * R;
    pos[i*3+1] = by * R;
    pos[i*3+2] = bz * R;
  }
  particleGeo.attributes.position.needsUpdate = true;

  particles.rotation.y = t * 0.012;
  particles.rotation.x = Math.sin(t*0.02) * 0.015;

  const s = 1 + ampCurrent*0.05;
  particles.scale.set(s,s,s);

  renderer.render(scene, camera);
}

initOrb();

/* =========================================================
   INTERACTION (voice-only, same behaviour as before)
========================================================= */
let listening = false;
let speaking = false;
let muted = false;
let attachedFile = null;
let audioCtx, analyser, micStream, rafId;

const statusText = document.getElementById('statusText');
const caption = document.getElementById('caption');
const captionRole = document.getElementById('captionRole');
const captionText = document.getElementById('captionText');

function setStatus(text, live){
  statusText.textContent = text;
  statusText.classList.toggle('live', !!live);
}
function showCaption(role, text){
  captionRole.textContent = role;
  captionText.textContent = text;
  caption.classList.add('show');
}
function hideCaptionLater(delay){
  clearTimeout(showCaption._t);
  showCaption._t = setTimeout(()=> caption.classList.remove('show'), delay || 5000);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let handsFreeEnabled = false;

function tryStartRecognition(){
  if(!recognition || listening) return;
  try{ recognition.start(); }catch(e){} // already starting/started — safe to ignore
}

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-GB';

  recognition.onstart = ()=>{
    listening = true;
    setStatus('Listening for "Jade"…', true);
    startMicVisualizer();
  };
  recognition.onend = ()=>{
    listening = false;
    stopMicVisualizer();
    // The stream drops on its own after a stretch of silence — that's normal
    // in continuous mode, not an error. Just quietly pick it back up.
    if(handsFreeEnabled) setTimeout(tryStartRecognition, 250);
    else if(!speaking) setStatus('Tap Jade to start hands-free listening');
  };
  recognition.onerror = (e)=>{
    listening = false;
    stopMicVisualizer();
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      handsFreeEnabled = false;
      setStatus('Microphone blocked — allow mic access, then tap Jade');
    }
    // other errors (no-speech, aborted, network blips) — onend handles the restart
  };
  recognition.onresult = (e)=>{
    // Deliberately NOT stopping the mic while Jade talks — that caused the
    // earlier glitching. Instead we just ignore anything heard mid-reply.
    if(speaking) return;
    const res = e.results[e.results.length - 1];
    const said = res[0].transcript.trim();
    if(!/\bjade\b/i.test(said)) return; // wake word required, ignores ambient chat
    const command = said.replace(/\bjade\b/i, '').trim();
    showCaption('You said', said);
    handleQuestion(command || said);
  };

  // Light self-heal: if hands-free is meant to be running but has gone
  // quiet for a few seconds with nothing listening and nothing speaking,
  // bring it back — covers rare cases the onend restart doesn't catch.
  setInterval(()=>{
    if(handsFreeEnabled && !listening && !speaking) tryStartRecognition();
  }, 4000);
}else{
  document.getElementById('unsupported').style.display = 'block';
}

document.getElementById('orbCanvas').addEventListener('click', ()=>{
  if(!recognition) return;
  if(speaking){ window.speechSynthesis.cancel(); speaking = false; }
  // One tap ever switches on hands-free — it never toggles back off from
  // here, so a second accidental tap can't silently kill listening again.
  handsFreeEnabled = true;
  tryStartRecognition();
});

async function startMicVisualizer(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    function loop(){
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a,b)=>a+b,0) / data.length;
      ampTarget = Math.min(1, avg / 90);
      rafId = requestAnimationFrame(loop);
    }
    loop();
  }catch(e){}
}
function stopMicVisualizer(){
  if(rafId) cancelAnimationFrame(rafId);
  ampTarget = 0;
  if(micStream){ micStream.getTracks().forEach(tr=>tr.stop()); micStream = null; }
  if(audioCtx){ audioCtx.close(); audioCtx = null; }
}

function animateSpeakingAmp(durationMs){
  const start = performance.now();
  function loop(now){
    if(!speaking){ ampTarget = 0; return; }
    const t = (now-start)/1000;
    ampTarget = (Math.sin(t*7)*0.5+0.5)*0.28 + Math.random()*0.03;
    if(now-start < durationMs) requestAnimationFrame(loop);
    else ampTarget = 0;
  }

// tiny IndexedDB helper — stores the directory handle itself so it survives reloads
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('jade-fs', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('handles');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = ()=> resolve();
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> resolve(null);
  });
}

async function buildFolderIndexFromHandle(handle){
  const index = {};
  for await (const [name, entryHandle] of handle.entries()){
    if(entryHandle.kind === 'file') index[name.toLowerCase()] = entryHandle;
  }
  return index;
}

async function activateFolderHandle(handle, count){
  folderHandle = handle;
  folderFiles = await buildFolderIndexFromHandle(handle);

}

async function readFileAsText(fileOrHandle){
  const file = fileOrHandle.getFile ? await fileOrHandle.getFile() : fileOrHandle;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      let content = ev.target.result;
      if(typeof content !== 'string') content = '[binary file — could not read as text]';
      if(content.length > 12000) content = content.slice(0,12000) + '\n...[truncated]';
      resolve(content);
    };
    reader.onerror = ()=> resolve('[could not read this file]');
    reader.readAsText(file);
  });
}
function findFolderFileByName(said){

  for(const name in folderFiles){
    const bare = name.replace(/\.[a-z0-9]+$/,'');
    if(spoken.includes(name) || spoken.includes(bare)) return folderFiles[name];
  }
  return null;
}

function extractCity(text){

function mentionsWeather(text){

function mentionsTimeOrDate(text){

async function fetchWeatherAt(lat, lon, label){
  try{
    const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,relative_humidity_2m&timezone=auto`);
    const w = await wRes.json();
    return {place: label, temp: w.current.temperature_2m, wind: w.current.wind_speed_10m, humidity: w.current.relative_humidity_2m};
  }catch(e){ return null; }
}
async function fetchWeather(city){
  try{
    const geoRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(city) + '&count=1');
    const geo = await geoRes.json();
    if(!geo.results || !geo.results.length) return null;
    const loc = geo.results[0];
    return fetchWeatherAt(loc.latitude, loc.longitude, loc.name + (loc.country ? ', ' + loc.country : ''));
  }catch(e){ return null; }
}

// Resolves ANY valid CSS colour — all ~150 named colours, hex, rgb(), hsl() —
// not a curated shortlist. Validated via the DOM's own colour parser, then
// read back as exact RGB through a 1x1 canvas. This is the permanent,
// hard-coded path: no word list to maintain, no "colour not recognised" gaps.
function isValidCssColor(str){
  const probe = new Option().style;
  probe.color = '';
  probe.color = str;
  return probe.color !== '';
}
function cssColorToHex(name){
  if(!isValidCssColor(name)) return null;
  const c = document.createElement('canvas'); c.width = c.height = 1;
  const ctx = c.getContext('2d');
  ctx.fillStyle = name;
  ctx.fillRect(0,0,1,1);
  const d = ctx.getImageData(0,0,1,1).data;
  return '#' + [d[0],d[1],d[2]].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function tryColorCommand(said){
  const m = said.match(/(?:change|make|turn|set)\s+(?:your\s+|the\s+)?(?:orb|colou?r)\s+(?:to\s+)?([a-zA-Z\s]+)/i);
  if(!m) return false;
  const name = m[1].trim().replace(/[.?!]+$/,'');
  if(!name) return false;
  const hex = cssColorToHex(name);
  if(!hex) return false;
  applyPalette(hex);
  speakReply(`Very good, sir. I'm ${name} now.`);
  return true;
}

// Reactor spool-up sound — built ONLY from sine waves and filtered noise.
// Deliberately no sawtooth/square waveforms this time, since those were the
// actual source of the buzzy "fart" tone. A warm sine hum plus a band-passed
// noise whine reads as a turbine/reactor spinning up instead.
function playReactorSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = 0.85;
    master.connect(ctx.destination);

    // warm low hum, sine only — no harmonics to buzz
    const hum = ctx.createOscillator();
    hum.type = 'sine';
    hum.frequency.setValueAtTime(90, now);
    hum.frequency.linearRampToValueAtTime(130, now + 1.6);
    const humGain = ctx.createGain();
    humGain.gain.setValueAtTime(0.0001, now);
    humGain.gain.exponentialRampToValueAtTime(0.22, now + 0.3);
    humGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.7);
    hum.connect(humGain); humGain.connect(master);
    hum.start(now); hum.stop(now + 1.75);

    // narrow band-passed noise whine, sweeping up — the "spin-up" texture
    const bufSize = ctx.sampleRate * 1.6;
    const noiseBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 14;
    bp.frequency.setValueAtTime(500, now);
    bp.frequency.exponentialRampToValueAtTime(2600, now + 1.4);
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, now + 0.2);
    noiseGain.gain.exponentialRampToValueAtTime(0.18, now + 1.0);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
    noise.connect(bp); bp.connect(noiseGain); noiseGain.connect(master);
    noise.start(now); noise.stop(now + 1.65);

    // bright confirmation chime, sine only
    const chime = ctx.createOscillator();
    chime.type = 'sine';
    chime.frequency.setValueAtTime(660, now + 1.55);
    chime.frequency.exponentialRampToValueAtTime(990, now + 1.8);
    const chimeGain = ctx.createGain();
    chimeGain.gain.setValueAtTime(0.0001, now + 1.55);
    chimeGain.gain.exponentialRampToValueAtTime(0.2, now + 1.6);
    chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
    chime.connect(chimeGain); chimeGain.connect(master);
    chime.start(now + 1.55); chime.stop(now + 2.05);

    setTimeout(()=> ctx.close(), 2300);
  }catch(e){}
}

// Same palette, descending instead of rising — for the shutdown sequence.
function playReactorCloseSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = 0.8;
    master.connect(ctx.destination);

    const hum = ctx.createOscillator();
    hum.type = 'sine';
    hum.frequency.setValueAtTime(140, now);
    hum.frequency.exponentialRampToValueAtTime(60, now + 0.75);
    const humGain = ctx.createGain();
    humGain.gain.setValueAtTime(0.0001, now);
    humGain.gain.exponentialRampToValueAtTime(0.2, now + 0.1);
    humGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
    hum.connect(humGain); humGain.connect(master);
    hum.start(now); hum.stop(now + 0.85);

    setTimeout(()=> ctx.close(), 1000);
  }catch(e){}
}

   Full-screen arc-reactor loading / closing sequence.

const loadOverlayEl = document.getElementById('loadOverlay');
const shutterLeft = document.getElementById('shutterLeft');

function playSequenceOpen(onRevealed){
  loadOverlayEl.classList.add('active');
  shutterLeft.classList.remove('opened');
  shutterRight.classList.remove('opened');
  void loadOverlayEl.offsetWidth; // force reflow so the transition actually plays
  requestAnimationFrame(()=>{
    shutterLeft.classList.add('opened');
    shutterRight.classList.add('opened');
  });

  playReactorSound();

  const phrases = ['ACCESSING RJHQ SYSTEMS','LOADING PROJECT DATA','SCANNING NETWORK','INTERFACE ONLINE'];
  let i = 0;
  loadTextEl.textContent = phrases[0];
  const stepMs = 430;
  const iv = setInterval(()=>{
    i++;
    if(i < phrases.length) loadTextEl.textContent = phrases[i];
    else clearInterval(iv);
  }, stepMs);

  setTimeout(()=>{
    loadOverlayEl.classList.remove('active');
    if(!holoBuilt){ buildHologramPanels(); holoBuilt = true; }
    holoOverlay.classList.add('open');
    if(onRevealed) onRevealed();
  }, phrases.length * stepMs + 250);
}

function playSequenceClose(onClosed){
  loadOverlayEl.classList.add('active');
  shutterLeft.classList.add('opened');
  shutterRight.classList.add('opened');
  void loadOverlayEl.offsetWidth;
  loadTextEl.textContent = 'CLOSING INTERFACE';
  playReactorCloseSound();
  requestAnimationFrame(()=>{
    shutterLeft.classList.remove('opened');
    shutterRight.classList.remove('opened');
  });

}

function tryUICommand(said){

  }
  if(/close\s+(the\s+)?(ui|interface|hologram|holograms)/i.test(said)){
    playSequenceClose(()=> speakReply('Very good, sir. Interface closed.'));

  }
  return false;
}

function tryPullUpCommand(said){

async function handleQuestion(said){
  const colorCommand = tryColorCommand(said);
  if(colorCommand) return;
  const uiCommand = tryUICommand(said);
  if(uiCommand) return;
  const pullUpCommand = tryPullUpCommand(said);
  if(pullUpCommand) return;
  const scanCommand = tryScanCommand(said);
  if(scanCommand) return;

  setStatus('Thinking…');
  let contextBlocks = [
    "You are Jade, a voice assistant modelled on an old-fashioned English gentleman's aide — formal, unflappable, quietly dry, in the register of a butler addressing his employer. Address the user as \"sir\" naturally and often, not just at the end — e.g. \"Right away, sir\", \"At your command, sir\", \"I'm afraid not, sir.\" Avoid modern AI-assistant phrasing entirely — never say things like \"Sure thing!\", \"Got it!\", \"okay I'm done\", \"Absolutely!\" or use exclamation marks. Prefer phrasing like \"Very good, sir\", \"As you wish\", \"Consider it done\", \"Certainly, sir.\" You are being spoken to out loud and your reply will be read aloud by text-to-speech, so answer conversationally in 1-4 short sentences — no markdown, no lists, nothing that only makes sense written down. Be honest and direct, never falsely flattering, and never claim uncertainty about the time, date, or your location — you always have both, given below.",
    `You are based in Lichfield, Staffordshire, England, United Kingdom. This is your fixed home location — always use it for any question about "here", local time, local date, or local weather unless the user names a different place.`
  ];
  if(mentionsTimeOrDate(said)){
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Europe/London' });
    const timeStr = now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' });
    contextBlocks.push(`Right now, in Lichfield, Staffordshire, UK (Europe/London time), it is ${timeStr} on ${dateStr}. Use this exact value — never say you can't access the clock.`);
  }
  if(attachedFile){
    contextBlocks.push(`The user has given you a file named "${attachedFile.name}" to read. Its content:\n\n${attachedFile.content}`);
  }else{
    const folderMatch = findFolderFileByName(said);
    if(folderMatch){
      const content = await readFileAsText(folderMatch);
      contextBlocks.push(`The user asked about a file named "${folderMatch.name}" from their folder. Its content:\n\n${content}`);
    }
  }
  const namedCity = extractCity(said);
  if(namedCity){
    const weather = await fetchWeather(namedCity);
    if(weather) contextBlocks.push(`Live weather data for ${weather.place}: ${weather.temp}°C, wind ${weather.wind} km/h, humidity ${weather.humidity}%. Use these real numbers.`);
  }else if(mentionsWeather(said)){
    const weather = await fetchWeatherAt(HOME_LOCATION.lat, HOME_LOCATION.lon, HOME_LOCATION.name);
    if(weather) contextBlocks.push(`Live weather data for ${weather.place} (home location): ${weather.temp}°C, wind ${weather.wind} km/h, humidity ${weather.humidity}%. Use these real numbers.`);
  }
  // Puter.js — free, no API key, no billing on your end. IMPORTANT: puter.ai.chat
  // has no separate "system" option — it must go inside the messages array as the
  // first message, or it's silently ignored (which is why replies came back as
  // markdown lists and the voice read the asterisks out loud).
  try{
    const reply = await puter.ai.chat([
      { role: 'system', content: contextBlocks.join('\n\n---\n\n') },
      { role: 'user', content: said }
    ], { model: 'gpt-5.4' });
    let text = (typeof reply === 'string' ? reply : (reply?.message?.content || reply?.text || '')).trim();
    text = stripMarkdown(text);
    speakReply(text || "I didn't quite catch a clean answer that time, sir — do ask me again.");
  }catch(err){
    speakReply("I'm unable to reach the AI service just now, sir. If a sign-in popup appeared, do complete it and ask again.");
  }
}

function stripMarkdown(text){
  return text
    .replace(/[*_`#]/g, '')
    .replace(/^[-•]\s+/gm, '')
    .replace(/\n{2,}/g, ' ')
    .replace(/\n/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function speakReply(text){
  showCaption('Jade', text);
  hideCaptionLater(Math.max(5000, text.length * 60));

  if(muted || !('speechSynthesis' in window)){ setStatus('Tap Jade to talk'); return; }
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.93; utter.pitch = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const enVoices = voices.filter(v=>v.lang && v.lang.startsWith('en'));
  const saved = parseInt(localStorage.getItem('jade_voice_index') || '-1', 10);
  // Posh, elderly English gentleman rather than a flat robotic default —
  // prefer mature-sounding UK voices (Daniel, Arthur, George etc), then any
  // UK English, then fall back to the sampler pick or the browser default.
  const preferred =
    (saved >= 0 && enVoices[saved]) ||
    voices.find(v=>/Daniel|Arthur|George|Ralph|Bruce|Oliver/i.test(v.name) && /en-GB|UK/i.test(v.lang + v.name)) ||
    voices.find(v=>v.lang === 'en-GB') ||
    voices.find(v=>v.default) || enVoices[0];
  if(preferred) utter.voice = preferred;

  utter.onstart = ()=>{ speaking = true; setStatus('Speaking…', true); animateSpeakingAmp(Math.max(1200, text.length*55)); };
  utter.onend = ()=>{ speaking = false; setStatus(handsFreeEnabled ? 'Listening for "Jade"…' : 'Tap Jade to start hands-free listening', handsFreeEnabled); ampTarget = 0; };
  utter.onerror = ()=>{ speaking = false; setStatus(handsFreeEnabled ? 'Listening for "Jade"…' : 'Tap Jade to start hands-free listening', handsFreeEnabled); };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

function makePanel({title, x, y, w, html}){
  const p = document.createElement('div');
  p.className = 'holo-panel';
  p.style.left = x+'px'; p.style.top = y+'px';
  if(w) p.style.width = w+'px';
  p.innerHTML = `<div class="holo-head holo-flicker"><span>${title}</span><span>◆</span></div><div class="holo-body">${html}</div>`;
  makeDraggable(p);
  return p;
}

function makeDraggable(panel){
  const head = panel.querySelector('.holo-head');
  let dragging = false, offX = 0, offY = 0;
  function start(clientX, clientY){
    dragging = true;
    const r = panel.getBoundingClientRect();
    offX = clientX - r.left; offY = clientY - r.top;
    holoStage.appendChild(panel); // bring to front
  }
  function move(clientX, clientY){
    if(!dragging) return;
    panel.style.left = (clientX - offX) + 'px';
    panel.style.top = (clientY - offY) + 'px';
  }
  function end(){ dragging = false; }

  head.addEventListener('mousedown', e=> start(e.clientX, e.clientY));
  window.addEventListener('mousemove', e=> move(e.clientX, e.clientY));
  window.addEventListener('mouseup', end);

  head.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
  window.addEventListener('touchmove', e=>{ const t=e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
  window.addEventListener('touchend', end);
}

/* =========================================================
   BODY SCAN — real camera feed, genuine (rough) heart-rate
   estimate from actual pixel data. NOT a medical device —
   labelled clearly as an experimental estimate throughout.
========================================================= */
const scanBtn = document.getElementById('scanBtn');
let scanPanel = null, scanStream = null, scanRAF = null;
let scanSamples = []; // rolling brightness samples for BPM estimate
const SCAN_SAMPLE_MS = 33; // ~30fps

function buildScanPanel(){
  const cx = innerWidth/2, cy = innerHeight/2;
  const p = makePanel({
    title:'BODY SCAN — LIVE', x:cx-150, y:cy-260, w:300,
    html:`
      <div class="scan-frame">
        <video id="scanVideo" autoplay muted playsinline></video>
        <div class="scan-grid"></div>
        <div class="scan-sweep"></div>
      </div>
      <div class="row" style="margin-top:10px"><span>HEART RATE (EST.)</span><span class="bpm-readout"><span class="bpm-pulse" id="bpmValue">--</span> BPM</span></div>
      <div class="row"><span>SIGNAL</span><span id="scanSignal">CALIBRATING…</span></div>
      <div class="scan-caveat">Experimental estimate from webcam colour changes — not a medical device. For real vitals, use a proper monitor or consult a professional.</div>
    `
  });
  holoStage.appendChild(p);
  scanPanel = p;
  startScan();
}

async function startScan(){
  const video = document.getElementById('scanVideo');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'user' } });
    video.srcObject = scanStream;
  }catch(e){
    if(e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError'){
      document.getElementById('scanSignal').textContent = 'NO CAMERA FOUND';
      speakReply("I'm afraid there's no camera on this device, sir. Do connect one and try again.");
    }else if(e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError'){
      document.getElementById('scanSignal').textContent = 'PERMISSION DENIED';
      speakReply("Camera access was declined, sir. Do allow it in your browser settings and try again.");
    }else{
      document.getElementById('scanSignal').textContent = 'CAMERA UNAVAILABLE';
      speakReply("I'm unable to reach a camera on this device, sir.");
    }
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.width = 32; canvas.height = 32; // tiny — we only need an average, not a picture
  const ctx = canvas.getContext('2d');
  scanSamples = [];

  scanRAF = setInterval(()=>{
    if(!video.videoWidth) return;
    ctx.drawImage(video, 0, 0, 32, 32);
    const frame = ctx.getImageData(0, 0, 32, 32).data;
    let sum = 0;
    for(let i=0;i<frame.length;i+=4) sum += frame[i]; // red channel — most sensitive to blood-flow changes
    scanSamples.push({ t: performance.now(), v: sum / (frame.length/4) });
    if(scanSamples.length > 300) scanSamples.shift(); // ~10s of history at 30fps

    if(scanSamples.length >= 90){ // need ~3s before a first estimate
      estimateBPM();
    }
  }, SCAN_SAMPLE_MS);
}

function estimateBPM(){
  const sig = scanSamples.map(s=>s.v);
  const mean = sig.reduce((a,b)=>a+b,0)/sig.length;
  const detrended = sig.map(v=>v-mean);

  // count peaks (simple threshold crossing) as a rough pulse-rate proxy
  const std = Math.sqrt(detrended.reduce((a,b)=>a+b*b,0)/detrended.length);
  if(std < 0.4){
    document.getElementById('scanSignal').textContent = 'WEAK — HOLD STILL';
    return;
  }
  let peaks = 0;
  for(let i=1;i<detrended.length-1;i++){
    if(detrended[i] > detrended[i-1] && detrended[i] > detrended[i+1] && detrended[i] > std*0.5) peaks++;
  }
  const spanSeconds = (scanSamples[scanSamples.length-1].t - scanSamples[0].t) / 1000;
  const bpm = Math.round((peaks / spanSeconds) * 60);

  const bpmEl = document.getElementById('bpmValue');
  const sigEl = document.getElementById('scanSignal');
  if(bpm >= 40 && bpm <= 180){
    bpmEl.textContent = bpm;
    sigEl.textContent = 'STABLE';
  }else{
    sigEl.textContent = 'RECALIBRATING…';
  }
}

function stopScan(){
  if(scanRAF) clearInterval(scanRAF);
  if(scanStream) scanStream.getTracks().forEach(t=>t.stop());
  scanRAF = null; scanStream = null;
}

scanBtn.addEventListener('click', ()=>{
  playSequenceOpen(()=>{ if(!scanPanel) buildScanPanel(); });
});

function tryScanCommand(said){
  if(/scan me|body scan|do a scan|start (the )?scan|check my vitals|my vitals/i.test(said)){
    playSequenceOpen(()=>{
      if(!scanPanel) buildScanPanel();
      speakReply("Scanning now, sir. This is a rough estimate from the camera, not a medical reading — do hold still for a few seconds.");
    });
    return true;
  }
  return false;
}
